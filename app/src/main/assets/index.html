<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FIZR PORTAL — Login</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:       #E53935;
      --red-dark:  #B71C1C;
      --red-dim:   rgba(229,57,53,0.12);
      --bg:        #0A0A0A;
      --surface:   #141414;
      --card:      #1C1C1C;
      --border:    #2A2A2A;
      --text:      #E8E8E8;
      --text-dim:  #6B6B6B;
      --font:      -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .wrapper {
      width: 100%;
      max-width: 400px;
    }

    /* ── Header ── */
    .brand {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .brand-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      background: var(--red);
      border-radius: 14px;
      margin-bottom: 1rem;
    }

    .brand-icon svg {
      width: 28px;
      height: 28px;
      fill: #fff;
    }

    .brand h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
    }

    /* ── Card ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
    }

    /* ── Form ── */
    .field {
      margin-bottom: 1.2rem;
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-dim);
      margin-bottom: 0.45rem;
      letter-spacing: 0.02em;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem 1rem;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.95rem;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: var(--red);
    }

    input::placeholder { color: var(--text-dim); }

    .btn {
      display: block;
      width: 100%;
      padding: 0.85rem;
      margin-top: 1.8rem;
      background: var(--red);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:hover  { background: #ef5350; }
    .btn:active { transform: scale(0.98); }

    /* ── Notice ── */
    .notice {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      margin-top: 1.5rem;
      background: var(--red-dim);
      border: 1px solid rgba(229,57,53,0.25);
      border-radius: 10px;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
      color: #EF9A9A;
      line-height: 1.5;
    }

    .notice svg { width: 16px; height: 16px; fill: #EF9A9A; flex-shrink: 0; margin-top: 1px; }

    /* ── Footer ── */
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>
  <div class="wrapper">

    <div class="brand">
      <div class="brand-icon">
        <!-- WiFi icon -->
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 9l2 2c5-5 13-5 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.237 4.237 0 0 0-6 0zm-4-4l2 2a7.074 7.074 0 0 1 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        </svg>
      </div>
      <h1>FIZR PORTAL</h1>
      <p>Masuk untuk mengakses jaringan</p>
    </div>

    <div class="card">
      <form method="POST" action="/login">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Masukkan username" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Masukkan password" autocomplete="current-password" required />
        </div>
        <button type="submit" class="btn">Masuk ke Jaringan</button>
      </form>

      <div class="notice">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <span>Dengan login, Anda menyetujui syarat penggunaan jaringan ini. Data login dicatat oleh administrator.</span>
      </div>
    </div>

    <div class="footer">FIZR PORTAL &mdash; Local Captive Portal</div>
  </div>
</body>
</html>
